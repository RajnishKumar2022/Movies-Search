<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Movie Search</title>
</head>

<body>
    <div id="heading">Movie Search Engine</div>
    <button id="gotoWishlist">Go to Wishlist</button>
    <div class="container">

        <div>
            <input type="text" id="search" placeholder="Type Movie Name Here...">
            <button id="btn">Search</button>
        </div>
        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTpkvQDacWUG52R1yM5Q-pN_uumKZWCgCI37Cyw-Iqedg&s=10"
                alt="" id="poster-image" height="290" width="254">
            <div class="title">Movie Title: Teesri Kasam</div>

            <div class="release-year">Release Year: 1966</div>
            <div class="rating">Rating: ⭐⭐⭐⭐⭐</div>
        </div>
        <button id="wishlist">Add to Wishlist</button>
    </div>

    <!-- <div class="toast">Successfully added to wishlist</div> -->
</body>

<script src="index.js"></script>

</html>
